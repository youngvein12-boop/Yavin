<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yavin</title>
<meta name="theme-color" content="#0B0B0A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;600&family=Geist+Mono:wght@400&display=swap">
<style>
:root{--bg:#0B0B0A;--surface:#161614;--line:#262622;--ink:#EDEDE6;--muted:#7D7D72;--lime:#BFDB4E;--err:#F08A76;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,textarea{font:inherit;color:inherit}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
header{display:flex;align-items:center;gap:8px;font:600 20px/1 var(--sans);letter-spacing:-.03em}
header i{width:8px;height:8px;border-radius:50%;background:var(--lime)}
textarea{flex:1;width:100%;margin-top:28px;border:0;background:transparent;resize:none;outline:none;
  font:300 24px/1.35 var(--sans);letter-spacing:-.015em;color:var(--ink);padding:0}
textarea::placeholder{color:#4A4A43}
.status{min-height:20px;font:400 13px/1.4 var(--mono);color:var(--muted);text-align:center;margin-bottom:18px}
.status.err{color:var(--err)}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.mic{grid-column:2;width:84px;height:84px;border-radius:50%;border:0;background:var(--lime);color:#0B0B0A;display:grid;place-items:center;cursor:pointer;position:relative}
.mic svg{width:32px;height:32px}
.mic .i-stop{display:none}
.mic.rec .i-mic{display:none}
.mic.rec .i-stop{display:block}
.mic.rec::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid var(--lime);animation:pulse 1.4s ease-out infinite}
.send{grid-column:3;justify-self:end;width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--lime);display:grid;place-items:center;cursor:pointer}
.send svg{width:22px;height:22px}
.send:disabled{opacity:.3}
@keyframes pulse{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header><i></i>yavin</header>
  <textarea id="input" placeholder="Toque no microfone e fale" aria-label="Pendência"></textarea>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="bar">
    <button class="mic" id="mic" aria-label="Gravar">
      <svg class="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <svg class="i-stop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <button class="send" id="send" aria-label="Enviar" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
</div>
<script>
// Link do Yavin no claude.ai (onde a IA organiza e o Gmail envia)
const APP_URL = "https://claude.ai/artifact/VLMvaaiWPNhCFgjW2WiDrX";

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

const input = document.getElementById("input"), mic = document.getElementById("mic"),
      sendBtn = document.getElementById("send"), statusEl = document.getElementById("status");
const status = (t, err) => { statusEl.textContent = t || ""; statusEl.className = "status" + (err ? " err" : ""); };
const sync = () => { sendBtn.disabled = !input.value.trim(); };
input.addEventListener("input", sync);

// texto -> base64url (só letras, números, - e _), que o claude.ai entrega ao app pelo #
function encode(text){
  const bytes = new TextEncoder().encode(text);
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function go(){
  const t = input.value.trim();
  if(!t) return;
  status("abrindo o Claude…");
  location.href = APP_URL + "#y" + encode(t);
}
sendBtn.addEventListener("click", () => { if(recording) finish(); else go(); });

// ---------- voz ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recording = false, ended = false, base = "", timer = null;
if(!SR) status("Este navegador não tem reconhecimento de voz. Use o Chrome.", true);

function setRec(on){ recording = on; mic.classList.toggle("rec", on); mic.setAttribute("aria-label", on ? "Parar e enviar" : "Gravar"); }
function afterRec(){
  if(ended) return; ended = true; clearTimeout(timer); setRec(false);
  if(input.value.trim()) go(); else status("Não captei nenhuma fala. Toque e fale de novo.", true);
}
function finish(){ try{ rec.stop(); }catch{} timer = setTimeout(() => { try{ rec.abort(); }catch{} afterRec(); }, 1500); }

mic.addEventListener("click", () => {
  if(!SR) return;
  if(recording){ finish(); return; }
  rec = new SR(); rec.lang = "pt-BR"; rec.continuous = true; rec.interimResults = true;
  base = input.value.trim(); ended = false;
  rec.onresult = e => {
    let fin = "", tmp = "";
    for(let i=0;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) fin += r[0].transcript + " "; else tmp += r[0].transcript; }
    input.value = [base, fin.trim(), tmp].filter(Boolean).join(" "); sync();
  };
  rec.onerror = e => {
    if(e.error === "not-allowed" || e.error === "service-not-allowed") status("Permita o microfone para este site nas configurações do Chrome.", true);
    else if(e.error === "network") status("O reconhecimento de voz precisa de internet.", true);
  };
  rec.onend = afterRec;
  try{ rec.start(); setRec(true); status("ouvindo · toque para enviar"); }
  catch{ status("Não consegui iniciar o microfone.", true); }
});
</script>
</body>
</html>
